<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Tic-Tac-Toe</h1>

        <div class="mode-selection">
            <button id="pvpModeBtn" class="mode-btn active">Player vs Player</button>
            <button id="aiModeBtn" class="mode-btn">Player vs Computer</button>
        </div>

        <div class="status-announcer" id="statusMessage">Player X's Turn</div>

        <div class="tic-tac-toe-board" id="gameBoard">
            <div class="cell" data-cell-index="0"></div>
            <div class="cell" data-cell-index="1"></div>
            <div class="cell" data-cell-index="2"></div>
            <div class="cell" data-cell-index="3"></div>
            <div class="cell" data-cell-index="4"></div>
            <div class="cell" data-cell-index="5"></div>
            <div class="cell" data-cell-index="6"></div>
            <div class="cell" data-cell-index="7"></div>
            <div class="cell" data-cell-index="8"></div>
        </div>

        <button id="resetBtn" class="reset-button">Restart Match</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
